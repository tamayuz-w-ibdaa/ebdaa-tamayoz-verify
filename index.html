<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من أصالة المنتج | إبداع وتميز</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#f5f7fa;
padding:20px;
text-align:center;
}

.card{
max-width:500px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.logo{
width:120px;
margin-bottom:15px;
}

.product{
width:220px;
border-radius:15px;
margin:15px auto;
display:none;
}

.success{
color:green;
font-size:24px;
font-weight:bold;
}

.error{
color:red;
font-size:24px;
font-weight:bold;
}

.info{
margin:8px 0;
font-size:18px;
}
</style>
</head>
<body>

<div class="card">

<img src="logo.png" class="logo">

<div id="result">
جاري التحقق من المنتج...
</div>

<img id="productImage"
src="ebdaa-tamayoz-product.png"
class="product">

</div>

<script>

const code =
new URLSearchParams(window.location.search).get("code");

fetch(
"https://script.google.com/macros/s/AKfycbylyYr1uL3_CklVBe-MyRDs7n4mOohqM9-FZMWAU_qNGaxiTgimuyDgv-h8Aw84J6Q1RQ/exec?code="
+ encodeURIComponent(code)
)
.then(r=>r.json())
.then(data=>{

if(data.success){

document.getElementById("productImage").style.display="block";

document.getElementById("result").innerHTML=`
<div class="success">✅ منتج أصلي</div>

<div class="info">
الكود: ${data.code}
</div>

<div class="info">
المنتج: ${data.product}
</div>

<div class="info">
الدفعة: ${data.batch}
</div>

<div class="info">
عدد مرات التحقق: ${data.scanCount}
</div>
`;

}else{

document.getElementById("result").innerHTML=`
<div class="error">
❌ المنتج غير موجود
</div>
`;

}

})
.catch(()=>{

document.getElementById("result").innerHTML=`
<div class="error">
تعذر الاتصال بالخادم
</div>
`;

});

</script>

</body>
</html>
