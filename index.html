<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التحقق من أصالة المنتج | Product Authenticity Verification</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma, Arial, sans-serif;
background:#f4f6f9;
padding:20px;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:100%;
max-width:500px;
background:#fff;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
width:140px;
margin-bottom:15px;
}

.title{
font-size:22px;
font-weight:bold;
color:#222;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
color:#666;
margin-bottom:20px;
}

.product-image{
width:220px;
max-width:100%;
border-radius:15px;
margin:15px auto;
display:none;
}

.success{
background:#e9f8ef;
color:#198754;
padding:15px;
border-radius:12px;
font-size:18px;
font-weight:bold;
line-height:1.8;
margin-bottom:15px;
}

.error{
background:#fdecec;
color:#dc3545;
padding:15px;
border-radius:12px;
font-size:18px;
font-weight:bold;
line-height:1.8;
}

.info{
background:#f8f9fb;
padding:14px;
border-radius:12px;
margin:10px 0;
line-height:1.8;
}

.label{
font-weight:bold;
color:#222;
margin-bottom:5px;
}

.warning{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:12px;
margin-top:12px;
line-height:1.8;
}

.loading{
font-size:18px;
color:#666;
line-height:1.8;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="Logo">

<div class="title">
التحقق من أصالة المنتج
</div>

<div class="subtitle">
Product Authenticity Verification
</div>

<div id="result" class="loading">
جاري التحقق من المنتج... | Verifying Product...
</div>

<img
id="productImage"
class="product-image"
src="ebdaa-tamayoz-product.png"
alt="Product">

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbylyYr1uL3_CklVBe-MyRDs7n4mOohqM9-FZMWAU_qNGaxiTgimuyDgv-h8Aw84J6Q1RQ/exec";

const code =
new URLSearchParams(window.location.search).get("code");

if(code){

fetch(API_URL + "?code=" + encodeURIComponent(code))
.then(response => response.json())
.then(data => {

window.history.replaceState({}, '', '/');

if(data.success){

document.getElementById("productImage").style.display = "block";

let html = `
<div class="success">
✅ Authentic & Verified Product | منتج أصلي ومعتمد
</div>

<div class="info">
<div class="label">
Product Name | اسم المنتج
</div>
${data.product}
</div>

<div class="info">
<div class="label">
Batch Number | رقم الدفعة
</div>
${data.batch}
</div>

<div class="info">
<div class="label">
Verification Count | عدد مرات التحقق
</div>
${data.scanCount}
</div>
`;

if(Number(data.scanCount) >= 20){

html += `
<div class="warning">
⚠️ This product has been verified many times | تم التحقق من هذا المنتج مرات عديدة
</div>
`;
}

document.getElementById("result").innerHTML = html;

}else{

document.getElementById("result").innerHTML = `
<div class="error">
❌ Product Not Found | المنتج غير موجود
</div>
`;

}

})
.catch(() => {

document.getElementById("result").innerHTML = `
<div class="error">
❌ Unable to connect to the server | تعذر الاتصال بالخادم
</div>
`;

});

}else{

document.getElementById("result").innerHTML = `
<div class="error">
❌ Product Code Missing | رمز المنتج غير موجود
</div>
`;

}

</script>

</body>
</html>
