<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التحقق من أصالة المنتج | إبداع وتميز</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f6f9;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:100%;
max-width:500px;
background:#fff;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.logo{
width:130px;
margin-bottom:15px;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
color:#666;
margin-bottom:20px;
}

.product-image{
width:220px;
max-width:100%;
border-radius:15px;
display:none;
margin:15px auto;
}

.success{
background:#e8f8ee;
color:#198754;
padding:15px;
border-radius:12px;
font-weight:bold;
line-height:1.8;
margin-bottom:15px;
}

.error{
background:#fdeaea;
color:#dc3545;
padding:15px;
border-radius:12px;
font-weight:bold;
line-height:1.8;
}

.info{
background:#f8f9fb;
padding:12px;
border-radius:12px;
margin:10px 0;
line-height:1.8;
}

.label{
font-weight:bold;
color:#333;
}

.warning{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:12px;
line-height:1.8;
margin-top:10px;
}

.loading{
font-size:17px;
color:#666;
line-height:1.8;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="Logo">

<div class="title">
التحقق من أصالة المنتج
</div>

<div class="subtitle">
Product Authenticity Verification
</div>

<div id="result" class="loading">
جاري التحقق من المنتج...<br>
Verifying Product...
</div>

<img
id="productImage"
class="product-image"
src="ebdaa-tamayoz-product.png"
alt="Product">

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbylyYr1uL3_CklVBe-MyRDs7n4mOohqM9-FZMWAU_qNGaxiTgimuyDgv-h8Aw84J6Q1RQ/exec";

const code =
new URLSearchParams(window.location.search).get("code");

if(code){

fetch(API_URL + "?code=" + encodeURIComponent(code))
.then(response => response.json())
.then(data => {

window.history.replaceState({}, '', '/');

if(data.success){

document.getElementById("productImage").style.display = "block";

let html = `
<div class="success">
✅ منتج أصلي ومعتمد<br>
✅ Authentic & Verified Product
</div>

<div class="info">
<div class="label">المنتج<br>Product</div>
${data.product}
</div>

<div class="info">
<div class="label">رقم الدفعة<br>Batch Number</div>
${data.batch}
</div>

<div class="info">
<div class="label">عدد مرات التحقق<br>Verification Count</div>
${data.scanCount}
</div>
`;

if(Number(data.scanCount) >= 20){

html += `
<div class="warning">
⚠️ تم التحقق من هذا المنتج مرات عديدة.<br>
⚠️ This product has been verified many times.
</div>
`;
}

document.getElementById("result").innerHTML = html;

}else{

document.getElementById("result").innerHTML = `
<div class="error">
❌ المنتج غير موجود<br>
❌ Product Not Found
</div>
`;

}

})
.catch(() => {

document.getElementById("result").innerHTML = `
<div class="error">
❌ تعذر الاتصال بالخادم<br>
❌ Unable to connect to server
</div>
`;

});

}else{

document.getElementById("result").innerHTML = `
<div class="error">
❌ رمز المنتج غير موجود<br>
❌ Product Code Missing
</div>
`;

}

</script>

</body>
</html>
